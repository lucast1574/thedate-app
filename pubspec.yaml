name: thedate_app
description: "Confirmaciones y regalos de The Date."
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^5.0.0
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  google_sign_in: ^7.2.0
  http: ^1.6.0
  intl: ^0.20.2
  url_launcher: ^6.3.2
  uuid: ^4.5.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans[opsz,wght].ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito[wght].ttf
